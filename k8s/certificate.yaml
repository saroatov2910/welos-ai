# Local TLS: a self-signed root CA issues the certificate for veloce.localhost.
# In production, replace the CA issuer with Let's Encrypt (ACME); the Certificate stays the same.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: veloce-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: veloce-local-ca
  secretName: veloce-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: veloce-local-ca
spec:
  ca:
    secretName: veloce-local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: decision-service-tls
  namespace: veloce
spec:
  secretName: decision-service-tls
  dnsNames:
    - veloce.localhost
  issuerRef:
    name: veloce-local-ca
    kind: ClusterIssuer
