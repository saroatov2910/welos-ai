# Jenkins identity in the cluster: least privilege.
# Jenkins may update and roll back deployments in the veloce namespace, and read what
# it needs to watch a rollout. It cannot read Secrets, create pods, or touch other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: veloce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: veloce
rules:
  # kubectl set image, rollout status, rollout undo
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout status and rollout undo read the ReplicaSets (one per revision)
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # show which pods are running, and their logs when a rollout fails
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: veloce
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: veloce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
# A long-lived token for the ServiceAccount, stored by Kubernetes in this Secret.
# Jenkins reads it once into a Jenkins credential; it is never committed anywhere.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: veloce
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
