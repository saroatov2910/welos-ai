# "Card data never leaves the network", enforced by the cluster, not just by the code.
# decision-service may receive requests, but it may not open any outbound connection:
# no internet, no other services. Even injected code could not send card data out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decision-service-deny-egress
  namespace: veloce
spec:
  podSelector:
    matchLabels:
      app: decision-service
  policyTypes:
    - Egress
  egress: []
---
# Only Traefik may reach decision-service. Any other pod in the cluster is refused,
# so nobody can skip the HTTPS, rate limit and security headers on the Ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decision-service-allow-traefik-only
  namespace: veloce
spec:
  podSelector:
    matchLabels:
      app: decision-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http # the container port name in deployment.yaml (8000)
