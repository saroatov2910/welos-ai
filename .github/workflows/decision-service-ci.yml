name: CI

# ----------------------------------------------------------------------------
# Runs when anything the system is built from changes: service code, agents, -
# the website, Kubernetes manifests, cluster config, or this workflow itself.-
# ----------------------------------------------------------------------------
  
on:
  push:
    branches: [main]
    paths:
      - "services/decision-service/**"
      - "agents/**"
      - "k8s/**"
      - "k3d/**"
      - "frontend/**"
      - ".github/workflows/decision-service-ci.yml"
  # Every pull request runs the full CI: the ruleset on main requires these checks,
  # so a path filter here would leave a PR that only touches other files unmergeable.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decision-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/decision-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/decision-service/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Test
        run: pytest -q

      # The same scans as Jenkins, but on the pull request, before anything reaches main.
      - name: "Security: code (bandit)"
        run: bandit -r app --severity-level medium

      - name: "Security: dependencies (pip-audit)"
        run: pip-audit -r requirements.txt

  agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one failing agent does not hide the results of the others
      matrix:
        agent: [deploy-verifier, fraud-analyst, guardian]
    defaults:
      run:
        working-directory: agents/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent's own dependencies, so a Dependabot update is really tested.
      # deploy-verifier and guardian use only the standard library and have none.
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install test tools
        run: pip install pytest==9.1.1 ruff==0.17.1 # pinned: same results locally and in CI

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # The React website: the same clean install and build that Vercel runs,
  # plus an audit of the npm packages. A broken build fails here, not on the live site.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: "Security: dependencies (npm audit)"
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks every manifest against the Kubernetes API schema of the cluster version,
      # plus the Traefik and cert-manager CRD schemas. A typo fails here, not at kubectl apply.
      - name: Validate with kubeconform
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /k8s
